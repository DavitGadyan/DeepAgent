  greenhouse: true
  lever: true
  ashby: true
  remoteok: true
  remotive: true
  weworkremotely: true
  hn_hiring: true
  yc_jobs: true
  jobicy: true
  startup_jobs: true
  teamtailor: true
  zoho_recruit: true
  freelancermap: true
  linkedin: false
  indeed: false

