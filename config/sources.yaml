remoteok:
  # One feed per tag. Empty list = the main feed (latest 100 jobs of every kind).
  tags: [ai, machine-learning, python]

# No settings: the public feed is read whole in one request (it ignores search filters).
# Terms: about four requests a day, so the adapter sends at most one per six hours and
# reuses the last result in between (the guard is kept in Redis).
remotive: {}

weworkremotely:
  feeds:
    - https://weworkremotely.com/categories/remote-programming-jobs.rss
    - https://weworkremotely.com/remote-jobs.rss

hn_hiring: {}

yc_jobs:
  pages:
    - /jobs
    - /jobs/role/software-engineer
    - /jobs/role/science

jobicy:
  # Optional filters: `industry` slug, `geo` slug, `tag` (text query, 3-50 chars).
  # Terms: at most one sync per hour (the adapter enforces this; the guard is kept in Redis).
  industry: data-science

startup_jobs:
  # One search per keyword. The server allows 20 HTTP requests a minute, handshake included.
  max_queries: 4

teamtailor:
  sites:
    - https://jobs.ethikos.es

zoho_recruit:
  sites:
    - https://www.talent40.com/jobs
  # The employer shown for each site; without an entry the hostname is used. The records'
  # department is an internal team code on staffing sites, so it only becomes a tag.
  names:
    https://www.talent40.com/jobs: All European Careers

freelancermap:
  max_queries: 3
  categories:
    - python-programming-language

linkedin:
  location: Worldwide
  max_queries: 3
  delay_seconds: 3

indeed:
  location: Remote
