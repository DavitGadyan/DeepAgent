# SearXNG for the researcher agent: internal only, JSON API on, no rate limiter.
use_default_settings: true

server:
  secret_key: "leadscout-internal-not-exposed" # the service has no published port
  limiter: false
  image_proxy: false

outgoing:
  # The default 3 s made every engine time out on a loaded machine; the tool waits 20 s.
  request_timeout: 6.0
  max_request_timeout: 10.0

search:
  safe_search: 0
  formats:
    - html
    - json # the researcher's web_search tool reads this
