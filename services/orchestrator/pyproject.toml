[project]
name = "orchestrator-service"
version = "0.1.0"
description = "LeadScout orchestrator: API, run lifecycle, event log. The only service that talks to Postgres."
requires-python = ">=3.12"
dependencies = [
  "leadscout-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
]

[tool.uv.sources]
leadscout-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator_service"]
