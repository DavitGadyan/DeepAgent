[project]
name = "extractor-service"
version = "0.1.0"
description = "LeadScout extractor agent."
requires-python = ">=3.12"
dependencies = ["leadscout-common[llm]"]

[tool.uv.sources]
leadscout-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extractor_service"]
