[project]
name = "applier-service"
version = "0.1.0"
description = "LeadScout applier: host-side worker that tailors the CV and fills application forms via Claude Code."
requires-python = ">=3.12"
dependencies = ["leadscout-common[tracing]"]

[tool.uv.sources]
leadscout-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["applier_service"]
