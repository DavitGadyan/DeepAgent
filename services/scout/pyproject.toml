[project]
name = "scout-service"
version = "0.1.0"
description = "Scout agent: pulls postings from job sources. No LLM."
requires-python = ">=3.12"
dependencies = [
    "leadscout-common",
    "selectolax>=0.3",
    "mcp>=2.3,<3",  # the 2.x `Client` API (in-process servers, read_timeout_seconds)
    # mcp -> pyjwt[crypto] -> cryptography; 49+ ships no Intel-macOS wheel and fails to build.
    "cryptography<49",
]

[tool.uv.sources]
leadscout-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scout_service"]
