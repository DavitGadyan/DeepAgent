[project]
name = "filter-service"
version = "0.1.0"
description = "Filter agent: drops postings that are not a target role, before any LLM call."
requires-python = ">=3.12"
dependencies = ["leadscout-common[tracing]"]

[tool.uv.sources]
leadscout-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filter_service"]
